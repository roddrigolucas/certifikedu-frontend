name: Deploy Plataforma to VPS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Plataforma via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/deploy/frontend
            git pull
            docker compose -f /root/deploy/backend/docker-compose.vps.yml up -d --build frontend
            echo "✅ Plataforma deploy concluído"
